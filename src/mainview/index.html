<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Chat</title>
    <script>
      // Apply the saved theme before first paint so cold start never flashes the
      // wrong theme. Reads the value cached by use-apply-theme.ts; keep this key
      // and the resolve rule in sync with that file. No cache (first ever launch)
      // falls back to the OS preference, matching the 'system' default.
      (() => {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
